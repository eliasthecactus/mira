name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Toolchain
        run: swift --version && sw_vers

      - name: Build
        run: swift build

      - name: Unit tests
        run: swift test

      - name: Install ffmpeg (decode check) and pyOpenSSL (mock DTLS sink)
        run: |
          brew install --quiet ffmpeg
          python3 -m venv .venv && .venv/bin/pip install --quiet pyopenssl cryptography

      # GitHub's macOS VMs have no hardware video encoder; software-encoding 1080p on
      # 3 vCPUs occasionally stalls the process, so timing checks get 150 ms of slack
      # here. Locally (`make e2e`) they stay strict.
      - name: End-to-end against mock sink
        run: |
          T=--timing-tolerance-ms=150
          E2E_OUT="$RUNNER_TEMP/e2e-aac"  tools/e2e.sh $T
          E2E_OUT="$RUNNER_TEMP/e2e-lpcm" E2E_DURATION=5 tools/e2e.sh $T --audio lpcm
          E2E_OUT="$RUNNER_TEMP/e2e-720"  E2E_DURATION=5 tools/e2e.sh $T --no-audio --no-m2 \
            "--video-formats=00 00 01 02 000000a1 00000000 00000000 00 0000 0000 00 none none"
          MIRA_ARGS="--test-pattern --security encrypted" E2E_OUT="$RUNNER_TEMP/e2e-enc" E2E_DURATION=5 \
            tools/e2e.sh $T --security encrypted
          # auto security: plain attempt is ignored, Mira falls back to PIN pairing
          MIRA_ARGS="--test-pattern --pin 24680135" E2E_OUT="$RUNNER_TEMP/e2e-pin" E2E_DURATION=5 \
            tools/e2e.sh $T --security pin --pin 24680135
          E2E_EXPECT_LOG="Bitrate.*packet loss" E2E_SKIP_DECODE=1 E2E_OUT="$RUNNER_TEMP/e2e-loss" E2E_DURATION=8 \
            tools/e2e.sh $T --loss 12
          E2E_PRIVACY=1 E2E_OUT="$RUNNER_TEMP/e2e-privacy" E2E_DURATION=8 tools/e2e.sh $T
          MIRA_ARGS="--test-pattern --low-latency" E2E_OUT="$RUNNER_TEMP/e2e-lowlat" E2E_DURATION=5 \
            tools/e2e.sh --timing-tolerance-ms=250
          # 4K over Miracast R2 (Windows' own sink capabilities: H.264 up to level 5.2)
          MIRA_ARGS="--test-pattern --resolution 4k" E2E_EXPECT_LOG="Chose 3840x2160p30" E2E_OUT="$RUNNER_TEMP/e2e-4k" \
            E2E_DURATION=5 tools/e2e.sh --timing-tolerance-ms=400 --wfd2 windows
          # HEVC via wfd2 (only if this machine can encode HEVC; otherwise Mira must fall back to H.264)
          if .build/debug/Mira doctor | grep -q "HEVC (H.265) encoder available"; then EXPECT="--expect-codec hevc"; else EXPECT="--expect-codec h264"; fi
          MIRA_ARGS="--test-pattern --codec hevc" E2E_OUT="$RUNNER_TEMP/e2e-hevc" E2E_DURATION=5 \
            tools/e2e.sh --timing-tolerance-ms=400 --wfd2 hevc $EXPECT   # software HEVC on the VM
          # A sink that rejects unknown M3 parameters: Mira retries with the R1 basics
          E2E_EXPECT_LOG="retrying with the basic parameters" E2E_OUT="$RUNNER_TEMP/e2e-strict" E2E_DURATION=4 \
            tools/e2e.sh $T --strict-m3 --wfd2 hevc
          # UIBC: the sink connects to Mira's input port, sends input, then disables it (M15)
          MIRA_ARGS="--test-pattern --remote-input" E2E_EXPECT_LOG="Received 3 input events" E2E_OUT="$RUNNER_TEMP/e2e-uibc" \
            E2E_DURATION=5 tools/e2e.sh $T --uibc

      - name: End-to-end Google Cast and DLNA against mock receivers
        run: |
          T=--timing-tolerance-ms=150
          E2E_OUT="$RUNNER_TEMP/cast"      E2E_DURATION=6 tools/e2e_cast.sh $T
          E2E_OUT="$RUNNER_TEMP/cast-loss" E2E_DURATION=6 tools/e2e_cast.sh $T --loss 8
          E2E_OUT="$RUNNER_TEMP/cast-pli"  E2E_DURATION=6 tools/e2e_cast.sh $T --pli-at 3
          E2E_OUT="$RUNNER_TEMP/cast-stop" E2E_STOP_AFTER=5 E2E_DURATION=0 E2E_TIMEOUT=25 \
            tools/e2e_cast.sh $T --expect-stop --timeout 25
          E2E_OUT="$RUNNER_TEMP/dlna" E2E_DLNA_DIRECT=1 E2E_DURATION=6 E2E_EXPECT_LOG="The TV stopped playing" \
            tools/e2e_dlna.sh
          for MODE in link form consent consent-user; do E2E_OUT="$RUNNER_TEMP/pair-$MODE" tools/e2e_pairing.sh $MODE; done

      - name: Package (ad-hoc signed)
        run: scripts/package.sh

      - uses: actions/upload-artifact@v4
        with:
          name: Mira-${{ github.sha }}
          path: dist/
          retention-days: 14
